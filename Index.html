<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा दोस्त ऐप</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 50px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h1 { color: #1877f2; }
        p { color: #333; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>स्वागत है!</h1>
        <p>मेरी दोस्त ऐप की वेबसाइट अब पूरी तरह से लाइव है।</p>
    </div>
</body>
</html>
